<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Defender - Protect Earth!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #0a0a2e 0%, #1a1a4e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            border: 3px solid #4a9eff;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(74, 158, 255, 0.5), inset 0 0 50px rgba(0, 0, 0, 0.5);
        }

        #gameCanvas {
            display: block;
            background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a1e 100%);
            border-radius: 7px;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(74, 158, 255, 0.8);
            pointer-events: none;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 30, 0.95);
            border-radius: 7px;
            color: #fff;
            text-align: center;
        }

        #gameOverScreen {
            display: none;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #4a9eff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
        }

        .subtitle {
            font-size: 20px;
            color: #888;
            margin-bottom: 30px;
        }

        .instructions {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .instructions span {
            color: #4a9eff;
            font-weight: bold;
        }

        button {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(135deg, #4a9eff, #a855f7);
            border: none;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(74, 158, 255, 0.6);
        }

        #finalScore {
            font-size: 36px;
            color: #4a9eff;
            margin: 20px 0;
        }

        #highScore {
            font-size: 18px;
            color: #a855f7;
            margin-bottom: 30px;
        }

        .powerup-info {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            font-size: 14px;
        }

        .powerup-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .powerup-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .shield-icon { background: #4a9eff; }
        .rapid-icon { background: #ffd700; }
        .spread-icon { background: #ff6b6b; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div id="score">Score: 0</div>
            <div id="level">Level: 1</div>
            <div id="lives">Lives: 3</div>
        </div>
        <div id="startScreen">
            <h1>Space Defender</h1>
            <p class="subtitle">Protect Earth from the Asteroid Storm!</p>
            <div class="instructions">
                <span>WASD</span> or <span>Arrow Keys</span> - Move your ship<br>
                <span>SPACE</span> or <span>Click</span> - Fire lasers<br>
                <span>P</span> - Pause game
            </div>
            <button id="startBtn">Start Mission</button>
            <div class="powerup-info">
                <div class="powerup-item">
                    <div class="powerup-icon shield-icon"></div>
                    <span>Shield</span>
                </div>
                <div class="powerup-item">
                    <div class="powerup-icon rapid-icon"></div>
                    <span>Rapid Fire</span>
                </div>
                <div class="powerup-item">
                    <div class="powerup-icon spread-icon"></div>
                    <span>Spread Shot</span>
                </div>
            </div>
        </div>
        <div id="gameOverScreen">
            <h1>Game Over</h1>
            <div id="finalScore">0</div>
            <div id="highScore">High Score: 0</div>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('level');
        const livesDisplay = document.getElementById('lives');
        const finalScoreDisplay = document.getElementById('finalScore');
        const highScoreDisplay = document.getElementById('highScore');

        // Game state
        let gameRunning = false;
        let paused = false;
        let score = 0;
        let level = 1;
        let lives = 3;
        let highScore = localStorage.getItem('spaceDefenderHighScore') || 0;

        // Player
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 80,
            width: 50,
            height: 40,
            speed: 6,
            dx: 0,
            dy: 0,
            shield: false,
            shieldTimer: 0,
            rapidFire: false,
            rapidFireTimer: 0,
            spreadShot: false,
            spreadShotTimer: 0
        };

        // Arrays for game objects
        let bullets = [];
        let asteroids = [];
        let particles = [];
        let powerups = [];
        let stars = [];

        // Input
        const keys = {};
        let shooting = false;
        let lastShot = 0;
        const shootCooldown = 200;

        // Initialize stars background
        function initStars() {
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 2 + 0.5,
                    brightness: Math.random()
                });
            }
        }

        // Create asteroid
        function createAsteroid() {
            const size = Math.random() * 40 + 20;
            const speed = Math.random() * 2 + 1 + level * 0.3;
            asteroids.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                size: size,
                speed: speed,
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 0.1,
                vertices: generateAsteroidVertices(),
                health: Math.ceil(size / 20)
            });
        }

        function generateAsteroidVertices() {
            const vertices = [];
            const numVertices = 8 + Math.floor(Math.random() * 4);
            for (let i = 0; i < numVertices; i++) {
                const angle = (i / numVertices) * Math.PI * 2;
                const radius = 0.7 + Math.random() * 0.3;
                vertices.push({ angle, radius });
            }
            return vertices;
        }

        // Create bullet
        function createBullet(x, y, angle = -Math.PI / 2) {
            const speed = 12;
            bullets.push({
                x: x,
                y: y,
                dx: Math.cos(angle) * speed,
                dy: Math.sin(angle) * speed,
                size: 4
            });
        }

        // Create particles
        function createExplosion(x, y, color, count = 20) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    color: color,
                    life: 1
                });
            }
        }

        // Create powerup
        function createPowerup(x, y) {
            if (Math.random() > 0.15) return;
            const types = ['shield', 'rapidFire', 'spreadShot'];
            const type = types[Math.floor(Math.random() * types.length)];
            const colors = { shield: '#4a9eff', rapidFire: '#ffd700', spreadShot: '#ff6b6b' };
            powerups.push({
                x: x,
                y: y,
                type: type,
                color: colors[type],
                size: 15,
                speed: 2
            });
        }

        // Draw player ship
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            // Shield effect
            if (player.shield) {
                ctx.beginPath();
                ctx.arc(0, 0, 35, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(74, 158, 255, ${0.5 + Math.sin(Date.now() / 100) * 0.3})`;
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // Ship body
            ctx.fillStyle = '#4a9eff';
            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(-20, 20);
            ctx.lineTo(-10, 15);
            ctx.lineTo(0, 18);
            ctx.lineTo(10, 15);
            ctx.lineTo(20, 20);
            ctx.closePath();
            ctx.fill();

            // Ship detail
            ctx.fillStyle = '#a855f7';
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(-8, 10);
            ctx.lineTo(0, 8);
            ctx.lineTo(8, 10);
            ctx.closePath();
            ctx.fill();

            // Engine glow
            ctx.fillStyle = `rgba(255, 150, 50, ${0.7 + Math.random() * 0.3})`;
            ctx.beginPath();
            ctx.moveTo(-8, 18);
            ctx.lineTo(0, 30 + Math.random() * 5);
            ctx.lineTo(8, 18);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // Draw asteroid
        function drawAsteroid(asteroid) {
            ctx.save();
            ctx.translate(asteroid.x, asteroid.y);
            ctx.rotate(asteroid.rotation);

            ctx.fillStyle = '#666';
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 2;
            ctx.beginPath();

            const firstVertex = asteroid.vertices[0];
            ctx.moveTo(
                Math.cos(firstVertex.angle) * asteroid.size * firstVertex.radius,
                Math.sin(firstVertex.angle) * asteroid.size * firstVertex.radius
            );

            for (let i = 1; i < asteroid.vertices.length; i++) {
                const v = asteroid.vertices[i];
                ctx.lineTo(
                    Math.cos(v.angle) * asteroid.size * v.radius,
                    Math.sin(v.angle) * asteroid.size * v.radius
                );
            }

            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Crater details
            ctx.fillStyle = '#555';
            ctx.beginPath();
            ctx.arc(asteroid.size * 0.2, asteroid.size * 0.1, asteroid.size * 0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(-asteroid.size * 0.3, -asteroid.size * 0.2, asteroid.size * 0.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Draw bullet
        function drawBullet(bullet) {
            ctx.fillStyle = '#4a9eff';
            ctx.shadowColor = '#4a9eff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(bullet.x, bullet.y, bullet.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Draw particle
        function drawParticle(particle) {
            ctx.globalAlpha = particle.life;
            ctx.fillStyle = particle.color;
            ctx.beginPath();
            ctx.arc(particle.x, particle.y, particle.size * particle.life, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        // Draw powerup
        function drawPowerup(powerup) {
            ctx.save();
            ctx.translate(powerup.x, powerup.y);

            // Glow
            ctx.shadowColor = powerup.color;
            ctx.shadowBlur = 15;

            // Outer ring
            ctx.strokeStyle = powerup.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, powerup.size, 0, Math.PI * 2);
            ctx.stroke();

            // Inner shape based on type
            ctx.fillStyle = powerup.color;
            if (powerup.type === 'shield') {
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();
            } else if (powerup.type === 'rapidFire') {
                ctx.fillRect(-3, -8, 6, 16);
            } else if (powerup.type === 'spreadShot') {
                for (let i = 0; i < 3; i++) {
                    const angle = (i - 1) * 0.4 - Math.PI / 2;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(angle) * 10, Math.sin(angle) * 10);
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            }

            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // Draw stars
        function drawStars() {
            stars.forEach(star => {
                const alpha = 0.5 + Math.sin(Date.now() / 1000 + star.brightness * 10) * 0.3;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Update game
        function update() {
            if (!gameRunning || paused) return;

            // Update player position
            player.x += player.dx;
            player.y += player.dy;

            // Boundary check
            player.x = Math.max(25, Math.min(canvas.width - 25, player.x));
            player.y = Math.max(25, Math.min(canvas.height - 25, player.y));

            // Handle shooting
            const now = Date.now();
            const cooldown = player.rapidFire ? shootCooldown / 3 : shootCooldown;
            if (shooting && now - lastShot > cooldown) {
                if (player.spreadShot) {
                    createBullet(player.x, player.y - 20, -Math.PI / 2);
                    createBullet(player.x, player.y - 20, -Math.PI / 2 - 0.2);
                    createBullet(player.x, player.y - 20, -Math.PI / 2 + 0.2);
                } else {
                    createBullet(player.x, player.y - 20);
                }
                lastShot = now;
            }

            // Update powerup timers
            if (player.shield && now > player.shieldTimer) player.shield = false;
            if (player.rapidFire && now > player.rapidFireTimer) player.rapidFire = false;
            if (player.spreadShot && now > player.spreadShotTimer) player.spreadShot = false;

            // Update stars
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });

            // Update bullets
            bullets = bullets.filter(bullet => {
                bullet.x += bullet.dx;
                bullet.y += bullet.dy;
                return bullet.y > -10 && bullet.y < canvas.height + 10 &&
                       bullet.x > -10 && bullet.x < canvas.width + 10;
            });

            // Update asteroids
            asteroids.forEach(asteroid => {
                asteroid.y += asteroid.speed;
                asteroid.rotation += asteroid.rotationSpeed;
            });

            // Remove off-screen asteroids (lose life if they pass)
            asteroids = asteroids.filter(asteroid => {
                if (asteroid.y > canvas.height + asteroid.size) {
                    if (!player.shield) {
                        lives--;
                        livesDisplay.textContent = `Lives: ${lives}`;
                        if (lives <= 0) {
                            gameOver();
                        }
                    }
                    return false;
                }
                return true;
            });

            // Update particles
            particles = particles.filter(particle => {
                particle.x += particle.dx;
                particle.y += particle.dy;
                particle.dx *= 0.98;
                particle.dy *= 0.98;
                particle.life -= 0.02;
                return particle.life > 0;
            });

            // Update powerups
            powerups = powerups.filter(powerup => {
                powerup.y += powerup.speed;
                return powerup.y < canvas.height + powerup.size;
            });

            // Collision detection: bullets vs asteroids
            bullets.forEach((bullet, bIndex) => {
                asteroids.forEach((asteroid, aIndex) => {
                    const dx = bullet.x - asteroid.x;
                    const dy = bullet.y - asteroid.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < asteroid.size) {
                        asteroid.health--;
                        bullets.splice(bIndex, 1);

                        if (asteroid.health <= 0) {
                            createExplosion(asteroid.x, asteroid.y, '#ff6b6b');
                            createPowerup(asteroid.x, asteroid.y);
                            score += Math.ceil(asteroid.size);
                            scoreDisplay.textContent = `Score: ${score}`;
                            asteroids.splice(aIndex, 1);

                            // Level up
                            if (score > level * 500) {
                                level++;
                                levelDisplay.textContent = `Level: ${level}`;
                            }
                        } else {
                            createExplosion(bullet.x, bullet.y, '#ffaa00', 5);
                        }
                    }
                });
            });

            // Collision detection: player vs asteroids
            if (!player.shield) {
                asteroids.forEach((asteroid, index) => {
                    const dx = player.x - asteroid.x;
                    const dy = player.y - asteroid.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < asteroid.size + 20) {
                        createExplosion(player.x, player.y, '#4a9eff', 30);
                        asteroids.splice(index, 1);
                        lives--;
                        livesDisplay.textContent = `Lives: ${lives}`;
                        if (lives <= 0) {
                            gameOver();
                        }
                    }
                });
            }

            // Collision detection: player vs powerups
            powerups.forEach((powerup, index) => {
                const dx = player.x - powerup.x;
                const dy = player.y - powerup.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < powerup.size + 20) {
                    const duration = 8000;
                    if (powerup.type === 'shield') {
                        player.shield = true;
                        player.shieldTimer = Date.now() + duration;
                    } else if (powerup.type === 'rapidFire') {
                        player.rapidFire = true;
                        player.rapidFireTimer = Date.now() + duration;
                    } else if (powerup.type === 'spreadShot') {
                        player.spreadShot = true;
                        player.spreadShotTimer = Date.now() + duration;
                    }
                    createExplosion(powerup.x, powerup.y, powerup.color, 10);
                    powerups.splice(index, 1);
                }
            });

            // Spawn asteroids
            if (Math.random() < 0.02 + level * 0.005) {
                createAsteroid();
            }
        }

        // Render game
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawStars();

            powerups.forEach(drawPowerup);
            bullets.forEach(drawBullet);
            asteroids.forEach(drawAsteroid);
            particles.forEach(drawParticle);

            if (gameRunning) {
                drawPlayer();
            }

            // Pause overlay
            if (paused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
            }
        }

        // Game loop
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        function startGame() {
            gameRunning = true;
            paused = false;
            score = 0;
            level = 1;
            lives = 3;
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
            player.shield = false;
            player.rapidFire = false;
            player.spreadShot = false;
            bullets = [];
            asteroids = [];
            particles = [];
            powerups = [];

            scoreDisplay.textContent = 'Score: 0';
            levelDisplay.textContent = 'Level: 1';
            livesDisplay.textContent = 'Lives: 3';

            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
        }

        // Game over
        function gameOver() {
            gameRunning = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('spaceDefenderHighScore', highScore);
            }
            finalScoreDisplay.textContent = score;
            highScoreDisplay.textContent = `High Score: ${highScore}`;
            gameOverScreen.style.display = 'flex';
        }

        // Input handlers
        document.addEventListener('keydown', e => {
            keys[e.code] = true;

            if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.dx = -player.speed;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') player.dx = player.speed;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') player.dy = -player.speed;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') player.dy = player.speed;
            if (e.code === 'Space') {
                e.preventDefault();
                shooting = true;
            }
            if (e.code === 'KeyP' && gameRunning) paused = !paused;
        });

        document.addEventListener('keyup', e => {
            keys[e.code] = false;

            if ((e.code === 'ArrowLeft' || e.code === 'KeyA') && player.dx < 0) player.dx = 0;
            if ((e.code === 'ArrowRight' || e.code === 'KeyD') && player.dx > 0) player.dx = 0;
            if ((e.code === 'ArrowUp' || e.code === 'KeyW') && player.dy < 0) player.dy = 0;
            if ((e.code === 'ArrowDown' || e.code === 'KeyS') && player.dy > 0) player.dy = 0;
            if (e.code === 'Space') shooting = false;
        });

        canvas.addEventListener('mousedown', () => { if (gameRunning) shooting = true; });
        canvas.addEventListener('mouseup', () => shooting = false);
        canvas.addEventListener('mouseleave', () => shooting = false);

        // Button handlers
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        // Initialize and start
        initStars();
        highScoreDisplay.textContent = `High Score: ${highScore}`;
        gameLoop();
    </script>
</body>
</html>
